name: UI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate test data
        run: python3 -m json.tool src/test/resources/testdata.json > /dev/null

      - name: Build test image
        run: docker compose build

      - name: Run tests in Docker
        run: |
          mkdir -p allure-results
          docker compose up --abort-on-container-exit --exit-code-from tests

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down

      - name: Take ownership of test results
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" allure-results

      - name: Load report history from gh-pages
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Java (for Allure)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/; fi
          cat > allure-results/executor.json <<JSON
          {"name": "GitHub Actions", "type": "github",
           "buildName": "Run #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}
          JSON
          npx --yes allure-commandline@2.32.0 generate allure-results --clean -o allure-report

      - name: Write run summary
        if: always()
        run: |
          S=allure-report/widgets/summary.json
          if [ -f "$S" ]; then
            {
              echo "## UI test results"
              echo "| Passed | Failed (incl. known defects) | Broken | Skipped | Total |"
              echo "|---|---|---|---|---|"
              jq -r '.statistic | "| \(.passed) | \(.failed) | \(.broken) | \(.skipped) | \(.total) |"' "$S"
              echo
              echo "Known defects (DEF-01 to DEF-04) are counted as failed; see DEFECTS.md and the Categories tab of the report."
              echo
              echo "Full report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Publish report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Fail on unexpected failures
        if: always()
        run: |
          shopt -s nullglob
          files=(allure-results/*-result.json)
          if [ ${#files[@]} -eq 0 ]; then echo "No test results found"; exit 1; fi
          known='[.links[]? | select(.type == "issue" and (.name | test("^DEF-")))] | length > 0'
          echo "Known defects: $(jq -s "[.[] | select(.status == \"failed\" and ($known))] | length" "${files[@]}")"
          unexpected=$(jq -s "[.[] | select((.status == \"failed\" or .status == \"broken\") and (($known) | not))] | length" "${files[@]}")
          echo "Unexpected failures: $unexpected"
          if [ "$unexpected" -gt 0 ]; then
            jq -r "select((.status == \"failed\" or .status == \"broken\") and (($known) | not)) | \"- \(.name): \(.statusDetails.message // \"no message\")\"" "${files[@]}"
            exit 1
          fi